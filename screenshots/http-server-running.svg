<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><rect width="1100" height="600" fill="#0f172a"/><text x="40" y="55" fill="#93c5fd" font-family="Consolas,monospace" font-size="26">HTTP Server - terminal verification</text><text x="40" y="110" fill="#e2e8f0" font-family="Consolas,monospace" font-size="22">$ node httpServer.js</text><text x="40" y="150" fill="#86efac" font-family="Consolas,monospace" font-size="22">HTTP Server running at http://localhost:3000</text><text x="40" y="220" fill="#cbd5e1" font-family="Consolas,monospace" font-size="22">GET /</text><text x="80" y="260" fill="#f8fafc" font-family="Consolas,monospace" font-size="20">Welcome to the Employee Task Management Application</text><text x="40" y="330" fill="#cbd5e1" font-family="Consolas,monospace" font-size="22">GET /tasks  -  200 OK  -  JSON array returned</text><text x="40" y="390" fill="#cbd5e1" font-family="Consolas,monospace" font-size="22">GET /about  -  200 OK  -  application information</text><text x="40" y="450" fill="#cbd5e1" font-family="Consolas,monospace" font-size="22">GET /home   -  200 OK  -  public/index.html via fs</text></svg>
